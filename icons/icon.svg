<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0D1B2E"/>
      <stop offset="100%" stop-color="#112038"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4B4"/>
      <stop offset="100%" stop-color="#009988"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D9FFF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="94" fill="none" stroke="#00D4B4" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Pulse Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00D4B4" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.25"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#4D9FFF" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Central Shield / Medical Cross Emblem -->
  <g transform="translate(256, 256)">
    <!-- Medical Cross with Gradient -->
    <path d="M -32,-110 L 32,-110 L 32,-32 L 110,-32 L 110,32 L 32,32 L 32,110 L -32,110 L -32,32 L -110,32 L -110,-32 L -32,-32 Z" 
          fill="url(#tealGrad)" filter="url(#glow)"/>
    
    <!-- Inner Core Cross -->
    <path d="M -16,-90 L 16,-90 L 16,-16 L 90,-16 L 90,16 L 16,16 L 16,90 L -16,90 L -16,16 L -90,16 L -90,-16 L -16,-16 Z" 
          fill="#0D1B2E"/>

    <!-- Training Graduation Cap / Growth Star in Centre -->
    <!-- Cap Top -->
    <polygon points="0,-36 44,-16 0,4 -44,-16" fill="url(#tealGrad)"/>
    <!-- Cap Base -->
    <path d="M -24,-7 L 0,4 L 24,-7 L 24,14 C 24,24 -24,24 -24,14 Z" fill="url(#blueGrad)"/>
    <!-- Tassel -->
    <path d="M 32,-11 L 42,10 L 46,9 L 36,-12 Z" fill="#FFB938"/>
    <circle cx="44" cy="12" r="3" fill="#FFB938"/>

    <!-- Training Analytics Growth Bars -->
    <rect x="-42" y="38" width="16" height="34" rx="4" fill="#4D9FFF"/>
    <rect x="-18" y="24" width="16" height="48" rx="4" fill="#00D4B4"/>
    <rect x="6" y="10" width="16" height="62" rx="4" fill="#4DDB8A"/>
    <rect x="30" y="-4" width="16" height="76" rx="4" fill="#FFB938"/>
  </g>

  <!-- Bottom Label -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" 
        fill="#DCE8F5" text-anchor="middle" letter-spacing="4">TRAINING INTEL</text>
  <text x="256" y="470" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" 
        fill="#00D4B4" text-anchor="middle" letter-spacing="2">AHMEDABAD DISTRICT</text>
</svg>
